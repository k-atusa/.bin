<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X_POS_TITLE</title>
    <style>
        body {
            background-color: #181818;
            color: #00ff00;
            font-family: 'Courier New';
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .shell {
            background-color: #000000;
            color: #00ff00;
            font-size: 0.9rem;
            border-radius: 5px;
            padding: 5px;
            margin-bottom: 5px;
            position: relative;
            width: calc(100% - 10px);
            box-sizing: border-box;
        }

        .sign {
            display: flex;
            gap: 5px;
            width: 100%;
        }

        .btn {
            background-color: #000000;
            color: #00ff00;
            font-size: 0.9rem;
            border-radius: 5px;
            padding: 8px 12px;
            margin-bottom: 5px;
            position: relative;
            height: 35px;
        }

        textarea.shell {
            height: 300px;
            resize: vertical;
        }

        #box_input {
            flex: 1;
            height: 35px;
            padding: 5px 10px;
        }

        #status {
            padding-left: 10px;
        }
    </style>
</head>

<body>
    <div class="sign">
        <h2 class="pgrName">X_POS_NAME</h2>
        <p id="status">ready</p>
    </div>
    <textarea class="shell"></textarea>
    <div class="sign">
        <button id="btn_play" class="btn"> START </button>
        <button id="btn_stop" class="btn"> STOP </button>
        <input type="text" class="shell" id="box_input" placeholder="Type input...">
        <button id="btn_enter" class="btn"> ENTER </button>
    </div>
</body>
<script src="script.js">
</script>

</html>
